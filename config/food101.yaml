# Selected completed MR=0.8 configuration; five seeds start at seed 1.
dataset: Food101
data_path: data
data_norm: standard
view_indices: [0, 1]
n_views: 2
n_classes: 101
encoder_dim:
  - [768, 1024, 1024, 1024, 128]
  - [768, 1024, 1024, 1024, 128]
batch_size: 1024
eval_batch_size: 1024
epochs: 200
warmup_epochs: 30
diagonal_epochs: 30
blr: 0.0005
min_blr: 0.0005
weight_decay: 0.0
momentum: 0.995
temperature: 0.5
drop_rate: 0.2
ema_dropout: 0.2
m_ratio: 0.8
device: cuda:0
seed: 1
num_runs: 5
output_dir: output
init: diagonal
steps: 8
step_size: 0.01
algorithm: stride_gw
solver:
  backend: fastnewton
  relative_tol: 0.001
  max_iter: 200
