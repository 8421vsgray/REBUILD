# Selected completed MR=0.8 configuration; five seeds start at seed 1.
dataset: Scene15
data_path: dataset
data_norm: standard
view_indices: [1, 0]
n_views: 2
n_classes: 15
encoder_dim:
  - [59, 1024, 1024, 1024, 128]
  - [20, 1024, 1024, 1024, 128]
batch_size: 512
eval_batch_size: 512
epochs: 200
warmup_epochs: 20
diagonal_epochs: 20
blr: 0.0005
min_blr: 0.0005
weight_decay: 0.0
momentum: 0.98
temperature: 0.5
drop_rate: 0.2
ema_dropout: 0.2
m_ratio: 0.8
device: cuda:0
seed: 1
num_runs: 5
output_dir: output
init: diagonal
steps: 3
step_size: 0.05
algorithm: stride_gw
prior_gate:
  lock: true
  lockmass: 0.001
  raw_offdiag_tol: 0.001
  on_projection_failure: true
solver:
  backend: fastnewton
  relative_tol: 0.001
  max_iter: 200
  warm_start: false
