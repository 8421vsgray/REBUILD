# Selected completed MR=0.8 configuration; five seeds start at seed 1.
dataset: Reuters
data_path: dataset
data_norm: standard
view_indices: [0, 1]
n_views: 2
n_classes: 6
encoder_dim:
  - [10, 256, 1024, 1024, 128]
  - [10, 256, 1024, 1024, 128]
batch_size: 1024
eval_batch_size: 1024
epochs: 200
warmup_epochs: 20
diagonal_epochs: 20
blr: 0.0002
min_blr: 0.0002
weight_decay: 0.0
momentum: 0.995
temperature: 0.5
drop_rate: 0.5
ema_dropout: 0.5
m_ratio: 0.8
device: cuda:0
seed: 1
num_runs: 5
output_dir: output
init: diagonal
steps: 4
step_size: 0.005
algorithm: stride_gw
prior_gate:
  lock: true
  lockmass: 0.15
  on_projection_failure: true
solver:
  backend: fastnewton
  relative_tol: 0.001
  max_iter: 200
